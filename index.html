<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alezonyth — SUBSCRIBE</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #e4002b;
    --red-deep: #9e001d;
    --paper: #ffffff;
    --ink: #1c1416;
    --soft: #f4efef;
    --line: #1c1416;
    --card: #ffffff;
    --muted: #6b5f62;
    --display: "Archivo Black", "Arial Black", Impact, sans-serif;
    --body: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #150f10; --ink: #f7f0f0; --soft: #211819;
      --line: #f7f0f0; --card: #1c1415; --muted: #b8aaad;
    }
  }
  :root[data-theme="dark"] {
    --paper: #150f10; --ink: #f7f0f0; --soft: #211819;
    --line: #f7f0f0; --card: #1c1415; --muted: #b8aaad;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }


  .curtain { position: fixed; inset: 0; z-index: 50; pointer-events: none; animation: curtainGone 0s linear 1.9s forwards; }
  .curtain i { position: absolute; top: 0; bottom: 0; background: var(--red); }
  .curtain .c1 {
    left: -30%; width: 85%;
    clip-path: polygon(0 0, 100% 0, 78% 100%, 0 100%);
    animation: slideLeft .85s cubic-bezier(.77,0,.18,1) 1s forwards;
  }
  .curtain .c2 {
    right: -30%; width: 85%;
    background: var(--red-deep);
    clip-path: polygon(22% 0, 100% 0, 100% 100%, 0 100%);
    animation: slideRight .85s cubic-bezier(.77,0,.18,1) 1s forwards;
  }
  .curtain-name {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-family: var(--display); color: #fff; text-align: center;
    font-size: clamp(1.6rem, 6vw, 3rem); padding: 0 24px;
    animation: nameOut .35s ease 0.85s forwards;
  }
  .curtain-name span { display: block; transform: skewX(-8deg); animation: nameIn .7s cubic-bezier(.2,.8,.2,1) .1s both; }
  @keyframes slideLeft  { to { transform: translateX(-120%); } }
  @keyframes slideRight { to { transform: translateX(120%); } }
  @keyframes nameIn  { from { opacity: 0; transform: skewX(-8deg) translateY(30px); } to { opacity: 1; transform: skewX(-8deg) translateY(0); } }
  @keyframes nameOut { to { opacity: 0; } }
  @keyframes curtainGone { to { visibility: hidden; } }


  .stage { flex: 1; display: grid; grid-template-columns: 1fr; }

  .hero {
    position: relative;
    background: var(--red);
    color: #fff;
    padding: 56px 28px 96px;
    animation: heroWipe .95s cubic-bezier(.7,0,.2,1) 1.3s backwards;
    clip-path: polygon(0 0, 100% 0, 100% 92%, 0 100%);
    overflow: hidden;
  }
  .hero::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(115deg, rgba(255,255,255,.07) 0 2px, transparent 2px 26px);
  }
  .hero::after {
    content: ""; position: absolute; right: -60px; bottom: -80px; width: 260px; height: 260px;
    background: var(--red-deep); transform: rotate(35deg); opacity: .55; pointer-events: none;
    animation: shapeIn .9s cubic-bezier(.2,.9,.2,1) 2.2s backwards;
  }
  .hero-inner { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; }

  .avatar {
    width: 104px; height: 104px; border-radius: 50%;
    background: #fff; color: var(--red);
    display: grid; place-items: center;
    font-family: var(--display); font-size: 2rem;
    box-shadow: 6px 6px 0 var(--red-deep), 0 0 0 4px #fff;
    margin-bottom: 28px;
    opacity: 0; animation: pop .6s cubic-bezier(.2,1.4,.4,1) 2.05s forwards;
  }
  @keyframes pop { from { opacity: 0; transform: scale(.6) rotate(-12deg); } to { opacity: 1; transform: none; } }
  @keyframes heroWipe { from { clip-path: polygon(0 0, 0 0, 0 100%, 0 100%); } }
  @keyframes shapeIn { from { opacity: 0; transform: translate(90px, 90px) rotate(35deg); } }

  h1 {
    margin: 0; font-family: var(--display); font-weight: 400;
    font-size: clamp(2.8rem, 12vw, 4.6rem); line-height: .92; letter-spacing: -.01em;
  }
  h1 .word { display: block; overflow: hidden; padding-bottom: .06em; }
  h1 .ch {
    display: inline-block; transform: translateY(110%) skewX(-8deg);
    animation: rise .6s cubic-bezier(.2,.9,.2,1) forwards;
    animation-delay: calc(2s + var(--i) * 38ms);
  }
  @keyframes rise { to { transform: translateY(0) skewX(-8deg); } }

  .handle { margin: 18px 0 6px; font-weight: 700; font-size: 1.05rem; opacity: 0; animation: show .5s ease 2.6s forwards; }
  .tagline { margin: 0; max-width: 34ch; line-height: 1.55; font-size: 1rem; opacity: 0; animation: show .5s ease 2.75s forwards; }
  @keyframes show { to { opacity: 1; } }

  .links { padding: 8px 20px 40px; }
  .links-inner { max-width: 520px; margin: 0 auto; }
  .links h2 {
    position: relative; display: inline-block;
    font-family: var(--display); font-weight: 400; font-size: 1.35rem; margin: 8px 0 22px; padding-bottom: 8px;
    opacity: 0; clip-path: inset(0 100% 0 0); transform: translateX(-24px) skewX(-8deg);
    animation: headingIn .75s cubic-bezier(.2,.9,.2,1) 1.75s forwards;
  }
  .links h2::after {
    content: ""; position: absolute; left: 0; bottom: 0; height: 4px; width: 100%; background: var(--red);
    transform: scaleX(0); transform-origin: left; animation: barDraw .6s cubic-bezier(.7,0,.2,1) 2.2s forwards;
  }
  @keyframes headingIn { to { opacity: 1; clip-path: inset(0 0 0 0); transform: translateX(0) skewX(-8deg); } }
  @keyframes barDraw { to { transform: scaleX(1); } }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }


  .item { opacity: 0; transform: translateX(46px); animation: slideIn .55s cubic-bezier(.2,.9,.2,1) forwards; animation-delay: calc(2.15s + var(--n) * 90ms); }
  @keyframes slideIn { to { opacity: 1; transform: none; } }

  .link {
    position: relative; display: grid; grid-template-columns: 48px 1fr 24px; align-items: center; gap: 16px;
    padding: 14px 18px 14px 14px; text-decoration: none; color: var(--ink);
    background: var(--card); border: 2px solid var(--line); border-radius: 4px; overflow: hidden;
    isolation: isolate; transition: color .25s ease, transform .25s ease, box-shadow .25s ease;
  }
  .link::before {
    content: ""; position: absolute; inset: 0; z-index: -1; background: var(--red);
    transform: translateX(-101%); transition: transform .35s cubic-bezier(.7,0,.2,1);
    clip-path: polygon(0 0, 100% 0, calc(100% - 22px) 100%, 0 100%);
  }
  .link:hover, .link:focus-visible { color: #fff; transform: translate(-3px, -3px); box-shadow: 5px 5px 0 var(--line); }
  .link:hover::before, .link:focus-visible::before { transform: translateX(0); }
  .link:focus-visible { outline: 3px solid var(--red); outline-offset: 3px; }
  .link:active { transform: translate(0, 0); box-shadow: none; }

  .ico { width: 48px; height: 48px; display: grid; place-items: center; background: var(--soft); border-radius: 50%; color: var(--red); transition: background .25s, color .25s; }
  .link:hover .ico, .link:focus-visible .ico { background: #fff; color: var(--red); }
  .ico svg { width: 24px; height: 24px; }
  .txt strong { display: block; font-size: 1.02rem; font-weight: 700; }
  .txt span { display: block; font-size: .86rem; color: var(--muted); margin-top: 2px; transition: color .25s; }
  .link:hover .txt span, .link:focus-visible .txt span { color: rgba(255,255,255,.88); }
  .chev { width: 22px; height: 22px; transition: transform .3s cubic-bezier(.2,.9,.2,1); }
  .link:hover .chev, .link:focus-visible .chev { transform: translateX(6px); }


  .link.primary { background: var(--red); color: #fff; border-color: var(--red); }
  .link.primary .ico { background: #fff; }
  .link.primary .txt span { color: rgba(255,255,255,.9); }
  .link.primary::before { background: var(--red-deep); }
  .link.primary:hover, .link.primary:focus-visible { box-shadow: 5px 5px 0 var(--ink); }


  .ticker {
    background: var(--ink); color: var(--paper); overflow: hidden; white-space: nowrap; margin-top: 8px;
    opacity: 0; clip-path: inset(0 100% 0 0); transform: translateY(36px) skewY(-1.2deg);
    animation: tickerIn .85s cubic-bezier(.2,.9,.2,1) 2.6s forwards;
  }
  @keyframes tickerIn { to { opacity: 1; clip-path: inset(0 0 0 0); transform: translateY(0) skewY(-1.2deg); } }
  .track { display: inline-flex; padding: 14px 0; animation: marquee 28s linear infinite; }
  .track span { font-family: var(--display); font-size: 1.05rem; padding: 0 22px; display: inline-flex; align-items: center; gap: 44px; }
  .track span::after { content: ""; width: 12px; height: 12px; background: var(--red); transform: rotate(45deg); }
  @keyframes marquee { to { transform: translateX(-50%); } }

  footer {
    text-align: center; padding: 22px 20px 28px; font-size: .85rem; color: var(--muted);
    opacity: 0; animation: show .6s ease 3.3s forwards;
  }


  @media (min-width: 880px) {
    .stage { grid-template-columns: 5fr 6fr; min-height: calc(100vh - 110px); }
    .hero {
      clip-path: polygon(0 0, 100% 0, 88% 100%, 0 100%);
      padding: 0 11% 0 8%; display: flex; align-items: center;
    }
    .hero-inner { margin: 0; }
    .links { display: flex; align-items: center; padding: 48px 6% 48px 4%; }
    .links-inner { width: 100%; max-width: 560px; margin: 0; }
  }


  @media (prefers-reduced-motion: reduce) {
    .curtain { display: none; }
    .avatar, .handle, .tagline, .item { animation: none; opacity: 1; transform: none; }
    .links h2 { animation: none; opacity: 1; clip-path: none; transform: skewX(-8deg); }
    .links h2::after { animation: none; transform: scaleX(1); }
    .hero, .hero::after { animation: none; }
    h1 .ch { animation: none; transform: skewX(-8deg); }
    .track { animation: none; }
    .ticker { animation: none; opacity: 1; clip-path: none; transform: skewY(-1.2deg); }
    footer { animation: none; opacity: 1; }
    .link, .link::before, .chev { transition: none; }
  }
</style>
</head>
<body>

<div class="curtain" aria-hidden="true">
  <i class="c1"></i><i class="c2"></i>
  <div class="curtain-name"><span id="curtainName"></span></div>
</div>

<main class="stage">
  <header class="hero">
    <div class="hero-inner">
      <div class="avatar" id="avatar" role="img" aria-label="Logo channel"></div>
      <h1 id="name"></h1>
      <p class="handle" id="handle"></p>
      <p class="tagline" id="tagline"></p>
    </div>
  </header>

  <section class="links" aria-labelledby="judulLink">
    <div class="links-inner">
      <h2 id="judulLink">Temukan saya di sini</h2>
      <ul id="list"></ul>
    </div>
  </section>
</main>

<div class="ticker" aria-hidden="true"><div class="track" id="track"></div></div>
<footer>© <span id="year"></span> <span id="footName"></span>. Terima kasih sudah menonton.</footer>

<script>
  var CHANNEL = {
    name: "Alezonyth",
    initials: "AL",
    handle: "@AlznythCH",
    tagline: "Konten seru setiap minggu. Subscribe biar tidak ketinggalan video terbaru.",
    ticker: ["Subscribe", "Nyalakan lonceng", "Tonton video terbaru", "Bagikan ke temanmu"],
    links: [
      { icon: "youtube",   title: "Subscribe di YouTube", desc: "Gabung jadi bagian dari keluarga channel ini",  url: "https://www.youtube.com/@AlznythCH", primary: true },
      { icon: "play",      title: "Video terbaru",        desc: "Tonton video terbaru dari channel ini",                 url: "https://www.youtube.com/@AlznythCH/streams" },
      { icon: "instagram", title: "Instagram",            desc: "Kegiatan harian dan cuplikan di balik layar", url: "https://instagram.com/mahnd.jpg" },
      { icon: "tiktok",    title: "TikTok",               desc: "Video pendek dan potongan terbaik dari channel ini",          url: "https://www.tiktok.com/@mahnd.mp4" },
      { icon: "chat",      title: "Grup komunitas",       desc: "Gabung ke komunitas discord channel ini",               url: "https://discord.gg/2nHmNtrQ4V" },
      { icon: "bag",       title: "Merchandise",          desc: "Coming Soon!",                      url: "" },
      { icon: "mail",      title: "Kerja sama",           desc: "Kirim pesan di Discord untuk bisnis dan kolaborasi",    url: "https://discord.com/users/788048513711603733" }
    ]
  };


  var ICONS = {
    youtube: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 7.2a2.5 2.5 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4A2.5 2.5 0 0 0 2.4 7.2C2 8.8 2 12 2 12s0 3.2.4 4.8a2.5 2.5 0 0 0 1.8 1.8C5.8 19 12 19 12 19s6.2 0 7.8-.4a2.5 2.5 0 0 0 1.8-1.8c.4-1.6.4-4.8.4-4.8s0-3.2-.4-4.8zM10 15V9l5 3-5 3z"/></svg>',
    play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
    instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>',
    tiktok: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 3c.3 2.2 1.7 3.8 4 4v3a7 7 0 0 1-4-1.3V15a6 6 0 1 1-6-6v3.2a2.8 2.8 0 1 0 3 2.8V3h3z"/></svg>',
    chat: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H9l-4.4 3.6A.5.5 0 0 1 3.800 20V5a1 1 0 0 1 .2-1z"/></svg>',
    bag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 8h12l1 12H5L6 8z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>',
    mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 7 9-7"/></svg>'
  };
  var CHEVRON = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';

  document.title = CHANNEL.name + " — SUBSCRIBE";
  document.getElementById("curtainName").textContent = CHANNEL.name;
  document.getElementById("avatar").textContent = CHANNEL.initials;
  document.getElementById("handle").textContent = CHANNEL.handle;
  document.getElementById("tagline").textContent = CHANNEL.tagline;
  document.getElementById("footName").textContent = CHANNEL.name;
  document.getElementById("year").textContent = new Date().getFullYear();

  var h1 = document.getElementById("name");
  h1.setAttribute("aria-label", CHANNEL.name);
  var idx = 0;
  CHANNEL.name.split(" ").forEach(function (w) {
    var word = document.createElement("span");
    word.className = "word";
    word.setAttribute("aria-hidden", "true");
    w.split("").forEach(function (c) {
      var s = document.createElement("span");
      s.className = "ch";
      s.style.setProperty("--i", idx++);
      s.textContent = c;
      word.appendChild(s);
    });
    h1.appendChild(word);
  });

  var list = document.getElementById("list");
  CHANNEL.links.forEach(function (l, n) {
    var li = document.createElement("li");
    li.className = "item";
    li.style.setProperty("--n", n);
    var a = document.createElement("a");
    a.className = "link" + (l.primary ? " primary" : "");
    a.href = l.url;
    if (/^https?:/.test(l.url)) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
    a.innerHTML = '<span class="ico">' + (ICONS[l.icon] || ICONS.play) + '</span>' +
      '<span class="txt"><strong></strong><span></span></span>' + CHEVRON;
    a.querySelector("strong").textContent = l.title;
    a.querySelector(".txt > span").textContent = l.desc;
    li.appendChild(a);
    list.appendChild(li);
  });

  var track = document.getElementById("track");
  var group = CHANNEL.ticker.map(function (t) { return "<span>" + t + "</span>"; }).join("");
  track.innerHTML = group + group + group + group;
</script>
</body>
</html>
